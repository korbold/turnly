name: customer_v2
description: Turnly Customer App V2
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7

  # DI
  get_it: ^8.0.0
  injectable: ^2.5.0

  # Navigation
  go_router: ^14.8.0

  # Network
  dio: ^5.7.0

  # Config
  flutter_dotenv: ^5.2.1

  # Functional
  fpdart: ^1.1.0

  # Storage
  flutter_secure_storage: ^9.2.0
  google_sign_in: ^6.2.1
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.0

  # Firebase / Push notifications
  firebase_core: ^3.8.1
  firebase_crashlytics: ^4.1.0
  firebase_analytics: ^11.3.3
  firebase_messaging: ^15.1.6
  firebase_auth: ^5.3.4
  connectivity_plus: ^6.1.0
  flutter_local_notifications: ^18.0.0

  # UI
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  smooth_page_indicator: ^1.2.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  url_launcher: ^6.3.2
  flutter_markdown: ^0.7.7+1

  # Deep links / App Links
  app_links: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  injectable_generator: ^2.6.0
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - .env.dev
    - .env.prod
    - assets/icon/turnly-customer-mark.svg
    - assets/icon/turnly-customer-1024.png
    - assets/icon/turnly-customer-adaptive-fg-432.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/turnly-customer-1024.png
  remove_alpha_ios: true
  adaptive_icon_background: "#F2693A"
  adaptive_icon_foreground: assets/icon/turnly-customer-adaptive-fg-432.png
  min_sdk_android: 21

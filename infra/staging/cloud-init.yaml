#cloud-config
# Bootstrap for turnly-staging. Mirrors the hand-built prod box measured over
# SSH on 2026-08-20 (see the turnly_prod_box_anatomy note): same OS, same PHP,
# same extensions, same four systemd units with their different users, same
# nginx shape including the two Reverb websocket locations.
#
# Deliberately NOT here:
#   - certbot. It runs before DNS has propagated and fails. The deploy workflow
#     issues the certificate in an idempotent step.
#   - application code, migrations, APP_KEY. That is the deploy workflow's job.
#   - external secrets (Resend, Firebase, Google, Turnstile). GitHub Actions
#     writes those; a value passed through Terraform lands in the state in clear.
#
# NOTE for editors: this file is rendered with templatefile(). Terraform only
# treats a dollar sign as special when a BRACE follows it — that pair is the
# interpolation marker, and doubling the dollar escapes it. Everything else is
# literal, so nginx's $uri and bash's $DB_PASS need no escaping at all and must
# be written with a single dollar. Doubling them ships a literal double dollar
# to the box and breaks both nginx and the bootstrap script.
#
# Only three dollar-brace placeholders are substituted here: api_hostname,
# operator_key and deploy_public_key. Never spell the marker out literally in a
# comment — it is still an interpolation, and it fails `tofu validate`.

package_update: true
package_upgrade: false

# Vultr's image ships /etc/ssh/sshd_config.d/50-cloud-init.conf with
# PasswordAuthentication yes. sshd honours the FIRST match it reads, and 50
# sorts before any 9x drop-in, so a later file cannot override it. This key
# makes cloud-init write 'no' into that same file. Found on the first real
# boot 2026-08-26: the box came up with password auth ON.
ssh_pwauth: false

# PHP comes from the ondrej/sury PPA, NOT from Ubuntu main — because that is
# where PROD gets it. Measured 2026-08-26: prod runs 8.3.31 from
# deb.sury.org while Ubuntu 24.04 main only ships 8.3.6. Matching the package
# SOURCE matters more than matching the digits; 25 patch releases of drift is
# exactly the kind of difference that makes a staging box lie.
#
# The key is embedded instead of using the "ppa:ondrej/php" shorthand because
# add-apt-repository needs api.launchpad.net, which times out from this box
# (ppa.launchpadcontent.net itself answers fine in 0.4s).

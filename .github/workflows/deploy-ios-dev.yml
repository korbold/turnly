name: Deploy iOS Dev (Firebase)

on:
  push:
    branches: [develop]
    paths:
      - 'apps/customer_v2/**'
      - '.github/workflows/deploy-ios-dev.yml'
  workflow_dispatch:

concurrency:
  group: deploy-ios-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Install Apple certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          security create-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "" build.keychain
          security list-keychains -d user -s build.keychain

          echo "$CERTIFICATE_BASE64" | base64 -d > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_DEV_BASE64: ${{ secrets.PROVISIONING_PROFILE_DEV_BASE64 }}
        run: |
          echo "$PROVISIONING_PROFILE_DEV_BASE64" | base64 -d > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Flutter dependencies
        working-directory: apps/customer_v2
        run: flutter pub get

      - name: Build IPA
        working-directory: apps/customer_v2
        run: |
          flutter build ipa --release \
            --flavor dev \
            --dart-define-from-file=.env.dev \
            --no-codesign

      - name: Export IPA
        working-directory: apps/customer_v2
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions-dev.plist \
            -exportPath build/ios/ipa-dev \
            -allowProvisioningUpdates

      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_APP_ID: "1:624883049252:ios:1b3b78df0f61ea58ab09b1"
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          npm install -g firebase-tools
          echo "$FIREBASE_SERVICE_ACCOUNT" > service_account.json
          export GOOGLE_APPLICATION_CREDENTIALS=service_account.json
          firebase appdistribution:distribute apps/customer_v2/build/ios/ipa-dev/*.ipa \
            --app "$FIREBASE_APP_ID" \
            --groups "test" \
            --release-notes "Branch: ${{ github.ref_name }} | Commit: ${{ github.sha }}"

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain build.keychain || true
          rm -f service_account.json
